name: Release — build + publish

# On a v* tag: build the wheel + sdist, publish them to PyPI and mirror them on
# the platform's own pip index (platform.entropi.ai/pip), so both work:
#   pip install ntropi
#   pip install --extra-index-url https://platform.entropi.ai/pip/ ntropi
#
# PyPI uses trusted publishing (OIDC, no token): on pypi.org add a trusted
# publisher for owner IhorTanyenkov, repository ntropi, workflow release.yml,
# environment pypi — and create the `pypi` environment on this repository.
# The platform mirror needs the DOWNLOADS_UPLOAD_SECRET repo secret (same value
# as the platform).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Tag matches package version (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but pyproject version is $v"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-platform:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload to platform pip index
        env:
          SECRET: ${{ secrets.DOWNLOADS_UPLOAD_SECRET }}
        run: |
          [ -n "$SECRET" ] || { echo "DOWNLOADS_UPLOAD_SECRET is not set"; exit 1; }
          for f in dist/*.whl dist/*.tar.gz; do
            echo "uploading $(basename "$f")"
            curl -fsS -X POST \
              "https://platform.entropi.ai/v1/pip/upload?project=ntropi&file=$(basename "$f")" \
              -H "x-upload-secret: ${SECRET}" --data-binary @"$f"; echo
          done
