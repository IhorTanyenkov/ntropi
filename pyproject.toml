[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ntropi"
version = "0.8.0"
description = "Python SDK and runtime for the Entropi stack — the nbot cognitive-compute node, Horizon eval/observability, and the NBotWeb chat-app gateway."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Source-available (see LICENSE)" }
authors = [{ name = "EntroPi AI", email = "it@entropi.ai" }]
keywords = ["nbot", "horizon", "agents", "llm", "sdk", "entropi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "tomli>=2; python_version<'3.11'",
    "tomli-w>=1",
]

[project.optional-dependencies]
# The SDK is the umbrella: `pip install ntropi[gateway]` also installs the
# NbotGateway server so `ntropi` can launch it. `web` kept as a back-compat alias.
gateway = ["nbot-gateway"]
web = ["nbot-gateway"]
cli = ["typer>=0.12"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "typer>=0.12",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://platform.entropi.ai"
Documentation = "https://platform.entropi.ai/docs?doc=sdk-overview"
Repository = "https://github.com/IhorTanyenkov/ntropi"
Changelog = "https://github.com/IhorTanyenkov/ntropi/blob/main/CHANGELOG.md"

[project.scripts]
ntropi = "ntropi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ntropi"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["PYI034"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["tomli", "tomli_w"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
